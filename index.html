<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luan Perretto</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Fonte Roca Two - Regular (arquivo local no repositório) */
    @font-face {
      font-family: 'Roca Two';
      src: url('Roca-Two-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* Fonte Roca Two - Bold (arquivo local no repositório) */
    @font-face {
      font-family: 'Roca Two';
      src: url('Roca-Two-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html { 
      scroll-behavior: smooth; 
      overscroll-behavior-y: contain;
    }

    body { 
      color: #111; 
      background-color: #fff; 
      padding: 0 20px; 
      max-width: 650px; 
      margin: 0 auto; 
      line-height: 1.6; 
      overscroll-behavior-y: contain;
      opacity: 0;
      transform: translateY(20px);
      /* Duração aumentada para 2.4s para uma transição bem lenta e suave */
      transition: opacity 2.4s cubic-bezier(0.16, 1, 0.3, 1), transform 2.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.loaded {
      opacity: 1;
      transform: translateY(0);
    }
    
    #topo { scroll-margin-top: 10px; }

    /* Menu superior */
    nav { 
      display: flex;
      justify-content: space-between;
      gap: 0;
      padding-top: 12px;
      padding-bottom: 12px; 
      margin-bottom: 36px;
      position: sticky;
      top: 0;
      background-color: #fff;
      z-index: 10;
      margin-left: -20px;
      margin-right: -20px;
      padding-left: 20px;
      padding-right: 20px;
    }

    /* Botões do cabeçalho e VOLTAR */
    nav a, .back-to-top { 
      font-family: 'Roca Two', sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.5px;
      text-decoration: none; 
      color: #333; 
      background-color: transparent; 
      padding: 8px 0; 
      text-align: center;
      display: inline-block;
      transition: color 0.2s ease, transform 0.2s ease; 
    }

    nav a:hover, .back-to-top:hover { 
      color: #000; 
      transform: scale(1.08);
    }

    nav a:active, .back-to-top:active,
    nav a:focus, .back-to-top:focus { 
      color: #000; 
      transform: scale(1.08);
    }

    /* Remove o "brilho" nativo do toque em TODOS os elementos clicáveis */
    nav a, .back-to-top, .social-links a,
    .modal-close-btn, .form-close-btn {
      -webkit-tap-highlight-color: transparent;
    }

    /* Ajuste da margem de scroll para compensar perfeitamente a barra fixa + o respiro homogêneo */
    #sobre, #projetos { scroll-margin-top: 72px; }

    h1 { 
      font-family: 'Roca Two', sans-serif;
      font-weight: 700;
      font-size: 52px;
      margin-bottom: 4px; 
      color: #111; 
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .subtitle { 
      font-family: 'Work Sans', sans-serif;
      font-size: 17px; 
      font-weight: 300; 
      color: #555; 
      margin-bottom: 20px; 
    }
    
    section { margin-bottom: 36px; }
    
    .section-title { 
      font-family: 'Roca Two', sans-serif;
      font-weight: 400;
      font-size: 24px; 
      letter-spacing: 0.5px;
      margin-bottom: 36px;
      color: #111;
    }

    /* Redes sociais - ícones em PNG */
    .social-links { 
      display: flex; 
      gap: 16px; 
      margin-bottom: 12px; 
      flex-wrap: wrap;
      align-items: center;
    }
    .social-links a { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background-color: transparent; 
      text-decoration: none; 
      width: 24px;
      height: 24px;
      transition: transform 0.2s ease; 
    }
    .social-links a img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .social-links a img[alt="WhatsApp"] {
      transform: scale(1.12);
    }
    .social-links a img[alt="GitHub"] {
      transform: scale(1.08);
    }
    .social-links a:hover,
    .social-links a:active {
      transform: scale(1.08); 
    }

    .email-text {
      font-family: 'Work Sans', sans-serif;
      font-weight: 300;
      font-size: 16px;
      color: #222;
      margin-bottom: 4px;
    }
    .email-text a { color: #222; text-decoration: none; }
    .email-text a:hover { text-decoration: underline; }

    .location-text {
      font-family: 'Work Sans', sans-serif;
      font-weight: 300;
      font-size: 16px;
      color: #555;
      margin-bottom: 36px;
    }

    .bio { 
      font-family: 'Work Sans', sans-serif;
      font-size: 16px; 
      font-weight: 300; 
      color: #222; 
    }

    /* Espaçamento homogêneo entre os parágrafos da bio (36px) */
    .bio p {
      margin-bottom: 36px;
    }
    .bio p:last-child {
      margin-bottom: 0;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 36px; /* Espaçamento idêntico entre os parágrafos da bio e entre as imagens de Projetos */
      margin-bottom: 36px;
    }

    .work-item { cursor: pointer; }

    .work-image-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .work-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .work-item:hover img { transform: scale(1.02); }

    .work-overlay-icon {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 5;
      transition: transform 0.2s ease;
    }

    .work-item:hover .work-overlay-icon {
      transform: scale(1.08);
    }

    .work-item:active .work-overlay-icon {
      transform: scale(1.08);
    }

    .expand-icon-container {
      position: relative;
      width: 12px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .expand-arrow-top-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 5px;
      border-top: 1px solid #333;
      border-right: 1px solid #333;
    }

    .expand-arrow-bottom-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 5px;
      height: 5px;
      border-bottom: 1px solid #333;
      border-left: 1px solid #333;
    }

    /* ============================================
        BLOCO AGRUPADO (imagens 6, 7 e 8)
        ============================================ */
    .multi-grid-item {
      position: relative;
    }

    .multi-grid-item .work-overlay-icon {
      top: 14px;
      right: 14px;
    }

    .multi-grid-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1.1fr 0.9fr;
      gap: 4px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      background-color: #fff;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    .multi-grid-inner .work-image-wrapper:nth-child(1) {
      grid-column: 1 / -1;
      grid-row: 1;
      overflow: hidden;
      border-radius: 0;
      box-shadow: none;
    }

    .multi-grid-inner .work-image-wrapper:nth-child(1) img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }

    .multi-grid-inner .work-image-wrapper:nth-child(2),
    .multi-grid-inner .work-image-wrapper:nth-child(3) {
      grid-row: 2;
      overflow: hidden;
      border-radius: 0;
      box-shadow: none;
      position: relative;
      z-index: 2;
    }

    .multi-grid-inner .work-image-wrapper:nth-child(2) img,
    .multi-grid-inner .work-image-wrapper:nth-child(3) img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ============================================
        MODAL DE PROJETO
        ============================================ */
    .modal-overlay {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(50, 50, 50, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overscroll-behavior: contain;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background-color: #fff;
      border-radius: 16px;
      overflow: hidden;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 0;
      cursor: pointer;
    }

    .modal-overlay.active .modal-card {
      opacity: 1;
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 24px;
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 10;
      transition: transform 0.2s ease, opacity 0.3s ease;
    }

    .modal-close-btn:hover { transform: scale(1.08); }
    .modal-close-btn:active { transform: scale(1.08); }

    .modal-card.immersive .modal-close-btn {
      opacity: 0;
      pointer-events: none;
    }

    .close-icon-container {
      position: relative;
      width: 12px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-line-1 {
      position: absolute;
      width: 12px;
      height: 1px;
      background-color: #333;
      transform: rotate(45deg);
    }

    .close-line-2 {
      position: absolute;
      width: 12px;
      height: 1px;
      background-color: #333;
      transform: rotate(-45deg);
    }

    .modal-scroll-content {
      overflow-y: auto;
      max-height: 90vh;
      border-radius: 16px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .modal-scroll-content img {
      width: 100%;
      height: auto;
      display: block;
    }
    .modal-scroll-content img:not(:last-child) {
      margin-bottom: 36px;
    }

    .modal-description {
      padding: 20px 24px;
      background-color: #fff;
      font-family: 'Work Sans', sans-serif;
      font-weight: 300;
      font-size: 16px;
      color: #222;
      line-height: 1.6;
    }

    .modal-description p { margin-bottom: 36px; }
    .modal-description p:last-child { margin-bottom: 0; }

    /* ============================================
        MODAL DO FORMULÁRIO DE E-MAIL
        ============================================ */
    .form-modal-overlay {
      display: flex;
